# Railway repo-level config.
# https://docs.railway.com/reference/config-as-code
#
# Single consolidated service: HTTP read API + scheduled indexer crons in one
# Nest process (see src/worker.module.ts). Replaces the previous two-service
# (api + worker) topology — kept the worker service, deleted the api service.
#
#   fast-auth-indexer-api  (HTTP + crons, references DATABASE_URL = ${{fast-auth-indexer-api-DB.DATABASE_URL}})
#     Settings → Deploy → Custom Start Command:  pnpm run worker:prod
#     Settings → Deploy → Healthcheck Path:      /api/health
#     Env:  DB_MIGRATIONS_RUN=1   (idempotent CREATE…IF NOT EXISTS)
#
# IMPORTANT: this file does NOT define [deploy].startCommand because that
# would override the service's per-UI setting (Railway repo-level toml wins
# over service-UI overrides). Set start command + healthcheck in the dashboard.
#
# Build via Nixpacks (auto-detects pnpm via the packageManager field).

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm run build"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
