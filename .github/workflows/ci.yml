name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One in-flight run per ref. A new push to a PR cancels the previous run so we
# don't burn minutes on stale commits. main pushes keyed by SHA never cancel
# each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ESLint enforces formatting too (prettier/prettier is an error rule),
      # so this single step covers lint + format drift.
      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # Jest coverageThreshold (branches 75 / statements 85) is enforced here —
      # the run fails if coverage regresses below the configured floor.
      - name: Test (with coverage)
        run: pnpm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
